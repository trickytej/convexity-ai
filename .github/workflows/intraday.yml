name: intraday

# On-demand catch-up: fresh SEC filings and X posts, then the thesis matcher.
# No schedule: everything runs once a day in the `ingest` workflow (an hourly
# cadence exhausted the Turso read quota). Run manually from the Actions tab.

on:
  workflow_dispatch: {}

concurrency:
  group: intraday
  cancel-in-progress: false

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install --upgrade pip && pip install .

      - name: Ensure schema
        run: digest init

      - name: SEC filings
        continue-on-error: true
        run: digest sec-sync --days 2

      - name: X posts
        continue-on-error: true
        run: digest x-sync --days 1

      - name: Match new evidence
        run: digest brief-match --days 2
