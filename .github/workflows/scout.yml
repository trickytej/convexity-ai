name: scout

# On-demand Scout sync: search Podscan for new watchlist appearances, ingest
# each one (Podscan transcript if available, else AssemblyAI), and extract
# insights — all against the hosted Turso DB. Run manually from the Actions
# tab; no schedule for now (deliberately removed — re-add a `schedule:` block
# here if/when nightly syncs are wanted again).

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Look-back window (days) for the Podscan search"
        required: false
        default: "7"

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      PODSCAN_API_KEY: ${{ secrets.PODSCAN_API_KEY }}
      ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg (audio extraction)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install package
        run: pip install --upgrade pip && pip install .

      - name: Ensure schema on Turso
        run: digest init

      - name: Sync Scout appearances
        run: digest scout-sync --days "${{ github.event.inputs.days || '7' }}" -v
