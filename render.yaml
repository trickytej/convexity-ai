# Render blueprint for the API. Deploy: New > Blueprint > pick this repo.
# All secrets are sync:false — set them in the Render dashboard after the first deploy.
services:
  - type: web
    name: research-digest-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter # always-on (~$7/mo); free tier sleeps when idle
    region: ohio # co-located with the Turso DB (aws-us-east-2 = Ohio) for low latency
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: DIGEST_API_KEY
        sync: false # shared secret the frontend proxy must send
      - key: ANTHROPIC_API_KEY
        sync: false # needed for on-demand report/digest/newsletter generation
      - key: PODSCAN_API_KEY
        sync: false # used by Scout to search podcast appearances
      - key: DIGEST_CORS_ORIGINS
        sync: false # e.g. https://your-app.vercel.app
      - key: DIGEST_SYNTHESIS_MODEL
        value: claude-opus-4-8
      # Background ingestion: "Refresh Feeds" dispatches the GitHub `ingest` workflow
      # (which has ffmpeg + the AssemblyAI/Anthropic/Turso secrets) to download +
      # transcribe + extract for the chosen range. Requires a fine-grained PAT.
      - key: GITHUB_DISPATCH_TOKEN
        sync: false # GitHub fine-grained PAT with "Actions: write" on the repo
      - key: GITHUB_REPO
        value: dav-s-git/research-digest
