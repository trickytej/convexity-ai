# Common mistranscriptions -> correct term. Used as hints for the correction pass
# (the LLM applies them in context, not as blind find/replace).
# Note: "Groq" (chip co.) vs "Grok" (xAI model) is intentionally left to the LLM
# to disambiguate from context rather than a hard alias.
aliases:
  "co-os": CoWoS
  "co-wos": CoWoS
  "H BM": HBM
  "in video": Nvidia
  "and video": Nvidia
  "T S M C": TSMC
  "cerebrus": Cerebras
  "samba nova": SambaNova
  "core weave": CoreWeave
  "v LLM": vLLM
  "mo E": MoE
  "D P I": DPI
  "T V P I": TVPI
