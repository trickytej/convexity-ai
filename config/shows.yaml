# Curated podcast registry. Only 9-ish shows, so a hand-maintained file beats a
# discovery API. Feed URLs verified against Apple's podcast directory.
#
# tier:
#   A = show publishes its own (human-grade) transcript -> fetch + parse, no ASR cost
#   B = no official transcript -> download audio, transcribe with AssemblyAI
#
# transcript_source: parser key for tier A; "asr" for tier B.

shows:
